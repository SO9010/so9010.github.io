server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Correct MIME types (application/javascript for life.js, application/json
    # for blogs.json) come from the bundled mime.types.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Never expose the .git checkout that the updater maintains in the docroot.
    location ~ /\. {
        deny all;
    }

    # Content that must reflect GitHub promptly: always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /blogs.json {
        add_header Cache-Control "no-cache";
    }

    # Code: short cache matching the update cadence so pushes propagate.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=300";
    }

    # Long-lived assets.
    location ~* \.(?:png|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # All routing is client-side hash-based, so no SPA rewrite is needed.
    location / {
        try_files $uri $uri/ =404;
    }
}
